version: '3.8'

services:
  # 1. BAZA DE DATE
  db:
    image: postgres:13-alpine 
    container_name: imobiliare_db_docker
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: imobiliare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. BACKEND (SERVER)
  server:
    build: ./server
    container_name: imobiliare_server
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASS=password123
      - DB_NAME=imobiliare_db
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads
      - ./server:/app
      - /app/node_modules

  # 3. FRONTEND (CLIENT)
  client:
    build: ./client
    container_name: imobiliare_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

# SECȚIUNEA PROBLEMĂ REPARATĂ:
volumes:
  pgdata: {}